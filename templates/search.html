<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Discovery Search — MIKY Intelligence</title>
    <meta name="description" content="Discover and search for new company leads with map visualization.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        .leaflet-popup-content-wrapper { border-radius: 10px !important; box-shadow: 0 4px 15px rgba(0,0,0,0.15) !important; }
        .leaflet-popup-content { margin: 10px 14px !important; font-family: 'Inter', sans-serif !important; font-size: 0.85rem !important; }
        .scroll-panel::-webkit-scrollbar { width: 5px; height: 5px; }
        .scroll-panel::-webkit-scrollbar-track { background: transparent; }
        .scroll-panel::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .scroll-panel::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        @keyframes fadeSlideIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .card-animate { animation: fadeSlideIn 0.22s ease-out both; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .spinner { animation: spin 0.7s linear infinite; }
        /* Use dynamic viewport height so mobile browser address bars don't clip bottom content */
        .h-dvh-screen { height: 100vh; height: 100dvh; }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 h-dvh-screen flex flex-col overflow-hidden antialiased">

    <!-- ===== NAVIGATION ===== -->
    <nav class="bg-white border-b border-slate-200 px-3 sm:px-6 flex items-center justify-between sm:justify-start h-12 sm:h-14 shrink-0 shadow-sm z-20">
        <div class="flex items-center gap-1.5 sm:mr-8">
            <div class="w-7 h-7 sm:w-8 sm:h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-blue-600 flex items-center justify-center shrink-0">
                <span class="text-white text-xs sm:text-sm font-bold">M</span>
            </div>
            <span class="font-bold text-slate-800 text-sm tracking-tight">MIKY</span>
        </div>
        <div class="flex gap-1 overflow-x-auto">
            <a href="/search" class="px-3 sm:px-4 py-1.5 sm:py-2 rounded-lg text-xs sm:text-sm font-semibold bg-indigo-50 text-indigo-700 border border-indigo-200 transition-colors whitespace-nowrap">
                🔍 Discovery Search
            </a>
            <a href="/matrix" class="px-3 sm:px-4 py-1.5 sm:py-2 rounded-lg text-xs sm:text-sm font-semibold text-slate-500 hover:bg-slate-100 hover:text-slate-700 transition-colors whitespace-nowrap">
                📊 Matrix Hub
            </a>
        </div>
    </nav>

    <!-- ===== PAGE HEADER & SCRAPER CONTROLS ===== -->
    <div class="bg-white border-b border-slate-200 px-3 sm:px-6 py-2.5 sm:py-3.5 shrink-0">
        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-2.5">
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-base sm:text-xl font-bold text-slate-900 flex items-center gap-2">
                        Discovery Search
                        <span id="resultBadge" class="text-xs font-bold bg-indigo-100 text-indigo-700 px-2.5 py-0.5 rounded-full">0</span>
                    </h1>
                    <p class="text-xs sm:text-sm text-slate-500 hidden sm:block mt-0.5">Find and discover new company leads</p>
                </div>
                <!-- Mobile Collapse Scraper Button -->
                <button id="toggleScraperMobile" onclick="toggleMobileSection('scraperControls')" class="md:hidden px-2.5 py-1.5 rounded-lg text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200 flex items-center gap-1">
                    ➕ New Lead Search
                </button>
            </div>

            <!-- Scraper Inputs (Collapsible on phone, always visible on tablet/desktop) -->
            <div id="scraperControls" class="hidden md:flex flex-col sm:flex-row items-stretch sm:items-center gap-2">
                <select id="scrapeCategory" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300 text-slate-700 cursor-pointer font-medium">
                    <option value="all">⚡ All Aluminium Profiles</option>
                    <option value="led">💡 LED Profiles</option>
                    <option value="tile">🔲 Tile Trim Profiles</option>
                    <option value="furniture">🪑 Furniture / Kitchen</option>
                    <option value="glass">🚿 Shower & Glass Profiles</option>
                    <option value="decorative">🎨 Wall & Ceiling Profiles</option>
                    <option value="extrusion">⚙️ Light Extrusions</option>
                </select>
                <div class="flex items-center gap-2">
                    <input type="text" id="scrapeLoc" placeholder="e.g. Germany, Kosovo..."
                        class="flex-1 sm:w-44 px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300 focus:border-indigo-400 transition placeholder:text-slate-400">
                    <button id="scrapeBtn" class="bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 text-white px-4 py-2 rounded-lg text-xs sm:text-sm font-semibold shadow-sm hover:shadow-md transition-all flex items-center justify-center gap-1.5 whitespace-nowrap shrink-0">
                        🔍 Find Leads
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== STATS ROW (Compact 4-col on mobile, spacious on desktop) ===== -->
    <div class="bg-white border-b border-slate-200 px-3 sm:px-6 py-2 sm:py-3 shrink-0">
        <div class="grid grid-cols-4 gap-1.5 sm:gap-3">
            <div class="bg-slate-50 rounded-lg sm:rounded-xl px-2.5 sm:px-4 py-1.5 sm:py-2.5 border border-slate-100 text-center sm:text-left">
                <div id="statTotal" class="text-base sm:text-2xl font-extrabold text-indigo-600 leading-tight">—</div>
                <div class="text-[10px] sm:text-xs font-medium text-slate-500 truncate">Companies</div>
            </div>
            <div class="bg-slate-50 rounded-lg sm:rounded-xl px-2.5 sm:px-4 py-1.5 sm:py-2.5 border border-slate-100 text-center sm:text-left">
                <div id="statEmail" class="text-base sm:text-2xl font-extrabold text-emerald-600 leading-tight">—</div>
                <div class="text-[10px] sm:text-xs font-medium text-slate-500 truncate">Emails</div>
            </div>
            <div class="bg-slate-50 rounded-lg sm:rounded-xl px-2.5 sm:px-4 py-1.5 sm:py-2.5 border border-slate-100 text-center sm:text-left">
                <div id="statPhone" class="text-base sm:text-2xl font-extrabold text-blue-600 leading-tight">—</div>
                <div class="text-[10px] sm:text-xs font-medium text-slate-500 truncate">Phones</div>
            </div>
            <div class="bg-slate-50 rounded-lg sm:rounded-xl px-2.5 sm:px-4 py-1.5 sm:py-2.5 border border-slate-100 text-center sm:text-left">
                <div id="statWebsite" class="text-base sm:text-2xl font-extrabold text-purple-600 leading-tight">—</div>
                <div class="text-[10px] sm:text-xs font-medium text-slate-500 truncate">Websites</div>
            </div>
        </div>
    </div>

    <!-- ===== LOADING BAR ===== -->
    <div id="loading" class="bg-white border-b border-slate-200 px-4 py-2.5 shrink-0 hidden">
        <div class="flex items-center justify-center gap-2.5 text-slate-500 text-xs sm:text-sm font-medium">
            <div class="w-4 h-4 border-2 border-indigo-300 border-t-indigo-600 rounded-full spinner shrink-0"></div>
            <span id="loadingText" class="truncate">Searching web and extracting company leads with AI...</span>
        </div>
    </div>

    <!-- ===== FILTER BAR (Smart Mobile Drawer + Full Desktop Bar) ===== -->
    <div class="bg-white border-b border-slate-200 px-3 sm:px-6 py-2.5 shrink-0">
        <!-- Top Row on Mobile: Search Input + Country + Filter Toggle -->
        <div class="flex items-center gap-2 lg:hidden mb-0">
            <input type="text" id="filterQMobile" placeholder="Search company..."
                class="flex-1 min-w-0 px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-indigo-300">
            <button onclick="toggleMobileSection('filterDrawer')" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-semibold flex items-center gap-1 shrink-0">
                ⚙️ Filters
            </button>
            <button onclick="resetAllFilters()" class="px-2.5 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-500 rounded-lg text-xs font-semibold shrink-0" title="Reset">
                ↺
            </button>
        </div>

        <!-- Full Filter Container (Collapsible on <lg, always flex on lg+) -->
        <div id="filterDrawer" class="hidden lg:flex flex-wrap items-center gap-2 mt-2.5 lg:mt-0 pt-2.5 lg:pt-0 border-t lg:border-t-0 border-slate-100">
            <!-- Desktop Company Search -->
            <input type="text" id="filterQ" placeholder="Search company name..."
                class="hidden lg:block px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300 focus:border-indigo-400 transition w-44 placeholder:text-slate-400">
            
            <!-- Country Filter -->
            <select id="filterCountry" class="w-[calc(50%-4px)] sm:w-auto lg:w-40 px-2.5 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300 text-slate-600 cursor-pointer">
                <option value="">🌍 Country: All</option>
                <option value="Georgia">Georgia</option>
                <option value="Germany">Germany</option>
                <option value="Poland">Poland</option>
                <option value="Turkey">Turkey</option>
                <option value="Kosovo">Kosovo</option>
                <option value="Albania">Albania</option>
                <option value="Serbia">Serbia</option>
                <option value="Bosnia">Bosnia</option>
                <option value="Croatia">Croatia</option>
                <option value="Romania">Romania</option>
                <option value="Bulgaria">Bulgaria</option>
                <option value="Greece">Greece</option>
                <option value="Italy">Italy</option>
                <option value="Spain">Spain</option>
                <option value="France">France</option>
                <option value="United Kingdom">United Kingdom</option>
                <option value="Netherlands">Netherlands</option>
                <option value="Belgium">Belgium</option>
                <option value="Austria">Austria</option>
                <option value="Switzerland">Switzerland</option>
                <option value="Czech Republic">Czech Republic</option>
                <option value="Hungary">Hungary</option>
                <option value="Slovakia">Slovakia</option>
                <option value="United Arab Emirates">UAE</option>
                <option value="Saudi Arabia">Saudi Arabia</option>
                <option value="Qatar">Qatar</option>
                <option value="Kuwait">Kuwait</option>
                <option value="Jordan">Jordan</option>
                <option value="Egypt">Egypt</option>
                <option value="Morocco">Morocco</option>
                <option value="United States">United States</option>
                <option value="Canada">Canada</option>
            </select>

            <!-- City / Address Filter -->
            <input type="text" id="filterCity" placeholder="City / address..."
                class="w-[calc(50%-4px)] sm:w-36 lg:w-40 px-2.5 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300 placeholder:text-slate-400">
            
            <select id="filterCategory" class="w-[calc(50%-4px)] sm:w-auto px-2.5 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300 text-slate-600 cursor-pointer">
                <option value="all">Category: All</option>
                <option value="LED">💡 LED Profile</option>
                <option value="Tile">🔲 Tile Trim</option>
                <option value="Furniture">🪑 Furniture</option>
                <option value="Glass">🚿 Glass</option>
                <option value="Decorative">🎨 Decorative</option>
                <option value="Extrusion">⚙️ Extrusion</option>
            </select>

            <select id="filterEmail" class="w-[calc(50%-4px)] sm:w-auto px-2.5 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300 text-slate-600 cursor-pointer">
                <option value="">Email: All</option>
                <option value="true">📧 Has Email</option>
                <option value="false">❌ No Email</option>
            </select>
            <select id="filterPhone" class="w-[calc(50%-4px)] sm:w-auto px-2.5 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-indigo-300 text-slate-600 cursor-pointer">
                <option value="">Phone: All</option>
                <option value
